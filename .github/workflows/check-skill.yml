name: check-skill

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Deterministic, zero-dependency — no install step needed.
      - run: npm test
      # Optional: also HTTP-check documentation links (kept off the gate by
      # default since it depends on the network).
      - run: CHECK_LINKS=1 node tests/check-skill.mjs
        continue-on-error: true
